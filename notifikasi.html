<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifikasi — CUFFLI ALL GAME</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body data-page="notifikasi">

  <!-- HEADER -->
  <header class="header">
    <div class="logo-wrap">
      <a href="index.html" style="display:flex;align-items:center;gap:10px">
        <img class="logo-img" src="logo.png" alt="Logo" onerror="this.style.display='none'">
        <span class="logo-text">CUFFLI ALL GAME</span>
      </a>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnNotif" onclick="toggleNotifPanel()" title="Notifikasi">
        <i class="fa-solid fa-bell"></i>
        <span class="badge" id="notifBadge" style="display:none">0</span>
      </button>
      <button class="btn-login" id="btnLogin" onclick="location.href='login.html'">
        <i class="fa-solid fa-user"></i> Login
      </button>
      <div class="user-area" id="userArea" style="display:none">
        <span class="user-name" id="userName">User</span>
        <button class="icon-btn" onclick="logoutUser()" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="page-content container">
    <div class="notif-page-header">
      <h1><i class="fa-solid fa-bell"></i> Notifikasi</h1>
      <button class="btn-clear-notif" onclick="clearAllNotifs()">Hapus Semua</button>
    </div>

    <div id="notifPageList" class="notif-page-list">
      <!-- diisi JS -->
    </div>
  </main>

  <!-- BOTTOM NAV -->
                  <nav class="bottom-nav bottom-nav-6">
    <a href="index.html" class="nav-item active">
      <i class="fa-solid fa-house"></i>
      <span>Beranda</span>
    </a>
    <a href="game.html" class="nav-item">
      <i class="fa-solid fa-gamepad"></i>
      <span>Game</span>
    </a>
    <a href="komunitas.html" class="nav-item">
      <i class="fa-solid fa-comments"></i>
      <span>Komunikasi</span>
    </a>
    <a href="tentang.html" class="nav-item">
      <i class="fa-solid fa-circle-info"></i>
      <span>Tentang</span>
    </a>
    <a href="kontak.html" class="nav-item">
      <i class="fa-solid fa-headset"></i>
      <span>Kontak</span>
    </a>
    <a href="login.html" class="nav-item">
      <i class="fa-solid fa-user"></i>
      <span>Akun</span>
    </a>
  </nav>

  <script src="firebase.js"></script>
  <script src="produk.js"></script>
  <script src="script.js"></script>
  <script>
    function clearAllNotifs() {
      localStorage.setItem('cuffli_notifs', '[]');
      updateNotifBadge();
      renderNotifPage();
    }

    function renderNotifPage() {
      const listEl = document.getElementById('notifPageList');
      if (!listEl) return;
      const notifs = getNotifications();
      if (notifs.length === 0) {
        listEl.innerHTML = `
          <div class="notif-empty-page">
            <i class="fa-regular fa-bell-slash" style="font-size:48px; color:var(--text-muted); margin-bottom:12px"></i>
            <p>Belum ada notifikasi</p>
            <p style="font-size:0.85rem; color:var(--text-muted)">Notifikasi promo, order, dan chat akan muncul di sini</p>
          </div>
        `;
        return;
      }
      listEl.innerHTML = notifs.map(n => `
        <div class="notif-page-item ${n.read ? '' : 'unread'} type-${n.type}">
          <div class="notif-icon">
            ${n.type === 'promo' ? '<i class="fa-solid fa-tag"></i>' : 
              n.type === 'success' ? '<i class="fa-solid fa-check"></i>' : 
              '<i class="fa-solid fa-info"></i>'}
          </div>
          <div class="notif-content">
            <div class="notif-text">${n.text}</div>
            <div class="notif-time">${n.time}</div>
          </div>
        </div>
      `).join('');
      // Mark all as read when opening the page
      markAllNotifRead();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderNotifPage();
    });
  </script>
</body>
</html>
