  <link rel="stylesheet" href="style.css">

<body data-page="pembayaran">

  <!-- HEADER -->
  <header class="header">
    <div class="logo-wrap">
      <a href="index.html" style="display:flex;align-items:center;gap:10px">
        <img class="logo-img" src="logo.png" alt="Logo">
        <span class="logo-text">CUFFLI ALL GAME</span>
      </a>
    </div>
  </header>

  <div class="pay-wrap" id="payContent">
    <h1 class="pay-title">Scan QRIS</h1>
    <p class="pay-produk-nama" id="payNama">—</p>
    <div class="pay-harga" id="payHarga">—</div>

    <div class="qris-box">
      <!-- Ganti src dengan foto QRIS kamu sendiri -->
      <img src="qris.jpg" alt="QRIS">
    </div>

    <p class="qris-time">Sisa waktu: <span id="qrisTimer">5:00</span></p>

    <a class="btn-wa" id="btnWA" href="wa.me/6287722626689" target="_blank" rel="noopener">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="wa.me/6287722626689"/></svg>
      Konfirmasi ke Admin
    </a>

    <p class="pay-note">
      Setelah transfer, tekan tombol di atas untuk konfirmasi ke admin via WhatsApp.<br>
      Akun akan dikirim setelah pembayaran terverifikasi.
    </p>
  </div>
