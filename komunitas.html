<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komunitas — CUFFLI ALL GAME</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body data-page="komunitas">

  <header class="header">
    <div class="logo-wrap">
      <a href="index.html" style="display:flex;align-items:center;gap:10px">
        <img class="logo-img" src="logo.png" alt="Logo" onerror="this.style.display='none'">
        <span class="logo-text">CUFFLI ALL GAME</span>
      </a>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnNotif" onclick="toggleNotifPanel()" title="Notifikasi">
        <i class="fa-solid fa-bell"></i>
        <span class="badge" id="notifBadge" style="display:none">0</span>
      </button>
      <button class="btn-login" id="btnLogin" onclick="location.href='login.html'">
        <i class="fa-solid fa-user"></i> Login
      </button>
      <div class="user-area" id="userArea" style="display:none">
        <span class="user-name" id="userName">User</span>
        <button class="icon-btn" onclick="logoutUser()" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="page-content container" style="padding-bottom:90px">
    <div class="komunitas-head">
      <h1><i class="fa-solid fa-comments" style="color:#00b4ff"></i> Komunikasi</h1>
      <p class="komunitas-sub">Komunitas CUFFLI · event, stok, spin & update</p>
    </div>

    <div class="komunitas-label">KOMUNITAS TERBARU</div>
    <div id="komunitasFeed" class="komunitas-feed"></div>

    <div class="info-card" style="margin-top:18px">
      <h3><i class="fa-solid fa-headset"></i> Chat admin langsung?</h3>
      <p style="font-size:0.85rem;color:#aaa;margin-bottom:10px">Buka halaman Kontak untuk WhatsApp & Telegram admin.</p>
      <a href="kontak.html" style="color:#00b4ff;font-weight:600;text-decoration:none;font-size:0.9rem">Ke Kontak Admin →</a>
    </div>
  </main>

      <nav class="bottom-nav bottom-nav-6">
    <a href="index.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>Beranda</span>
    </a>
    <a href="game.html" class="nav-item">
      <i class="fa-solid fa-gamepad"></i>
      <span>Game</span>
    </a>
    <a href="komunitas.html" class="nav-item active">
      <i class="fa-solid fa-comments"></i>
      <span>Komunikasi</span>
    </a>
    <a href="tentang.html" class="nav-item">
      <i class="fa-solid fa-circle-info"></i>
      <span>Tentang</span>
    </a>
    <a href="kontak.html" class="nav-item">
      <i class="fa-solid fa-headset"></i>
      <span>Kontak</span>
    </a>
    <a href="login.html" class="nav-item">
      <i class="fa-solid fa-user"></i>
      <span>Akun</span>
    </a>
  </nav>

  <script src="firebase.js"></script>
  <script src="produk.js"></script>
  <script src="script.js"></script>
  <script src="komunikasi.js"></script>
</body>
</html>
